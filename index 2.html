  const [picking, setPicking] = useState(false);
  const [acked, setAcked] = useState(new Set());
  const post = () => { if (!draft.trim()) return; addPost({ author: "Worth Ainsworth", dept: "Marketing", audience: aud, time: "now", text: draft.trim() }); setDraft(""); setAud("Everyone"); };

    <div style={{ padding: "4px 16px 20px" }}>

          <textarea value={draft} onChange={(e) => setDraft(e.target.value)} rows={2} placeholder="Share something with the team..." style={{ flex: 1, border: "none", outline: "none", resize: "none", fontFamily: body, fontSize: 13.5, color: c.ink, background: "none", lineHeight: 1.4, paddingTop: 6 }} />
        </div>

          <button onClick={() => setPicking(!picking)} style={{ display: "flex", alignItems: "center", gap: 5, border: "1px solid " + c.line, cursor: "pointer", fontFamily: body, fontSize: 11.5, fontWeight: 700, padding: "6px 11px", borderRadius: 999, background: c.paper, color: c.pine }}>
            {aud === "Everyone" ? <Globe size={13} strokeWidth={2.5} /> : <Hash size={13} strokeWidth={2.5} />}
            {aud}
            <ChevronDown size={13} color={c.faint} style={{ transform: picking ? "rotate(180deg)" : "none" }} />
          </button>
          <button onClick={post} style={{ background: c.pine, border: "none", borderRadius: 999, padding: "7px 15px", fontFamily: body, fontWeight: 700, fontSize: 12.5, color: "#F5F1E8", cursor: "pointer" }}>Post</button>
        </div>
        {picking && (
          <div style={{ marginTop: 10, borderTop: "1px solid " + c.line, paddingTop: 10 }}>
            <div style={{ fontFamily: body, fontSize: 10.5, fontWeight: 700, letterSpacing: "0.04em", textTransform: "uppercase", color: c.faint, marginBottom: 8 }}>Post to</div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {AUDIENCES.map((a) => (
                <button key={a} onClick={() => { setAud(a); setPicking(false); }} style={{ border: "none", cursor: "pointer", fontFamily: body, fontSize: 11.5, fontWeight: 600, padding: "5px 10px", borderRadius: 999, background: aud === a ? c.pine : c.paper, color: aud === a ? "#F5F1E8" : c.sub }}>{a}</button>
              ))}
            </div>
          </div>
        )}
      </div>
      {posts.map((p, i) => (
        <div key={"p" + i} style={{ background: c.card, borderRadius: 18, padding: 16, marginTop: 12, border: "1px solid " + c.line }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 9 }}>
            <Avatar name={p.author} size={34} bg={c.pine2} />
            <div style={{ flex: 1, lineHeight: 1.15 }}>
              <div style={{ fontFamily: body, fontWeight: 700, fontSize: 13.5, color: c.ink }}>{p.author}</div>
              <div style={{ fontFamily: body, fontSize: 11.5, color: c.faint }}>{p.dept} \u00b7 {p.time}</div>
            </div>
            {p.audience === "Everyone" ? <Badge bg={c.honey + "1F"} color="#B4772A">Everyone</Badge> : <Badge bg={c.pine + "12"} color={c.pine}>{p.audience}</Badge>}
          </div>
          <div style={{ fontFamily: body, fontSize: 13.5, color: c.ink, lineHeight: 1.45 }}>{p.text}</div>
        </div>
      ))}
      {ANNOUNCEMENTS.map((a, i) => {
        const iAcked = acked.has(i);
        const ackMode = !!a.requireAck;
        const total = a.readBy.length + a.notYet.length;
        return (
        <div key={"a" + i} style={{ background: c.card, borderRadius: 18, padding: 16, marginTop: 12, border: "1px solid " + c.line, boxShadow: (ackMode && !iAcked) ? "0 0 0 2px " + c.honey : (a.pinned ? "0 0 0 2px " + c.honeySoft : "none") }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
            <div style={{ width: 34, height: 34, borderRadius: 10, background: c.pine, display: "flex", alignItems: "center", justifyContent: "center" }}><Megaphone size={17} color="#F5F1E8" strokeWidth={2.2} /></div>
            <div style={{ flex: 1, lineHeight: 1.15 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                <span style={{ fontFamily: body, fontWeight: 700, fontSize: 13.5, color: c.ink }}>{a.from}</span>
                <Badge bg={c.pine} color="#F5F1E8">Official</Badge>
                {ackMode && <Badge bg={c.honey} color="#3A2A08">Action required</Badge>}
              </div>
              <div style={{ fontFamily: body, fontSize: 11.5, color: c.faint }}>{a.role} \u00b7 {a.time}</div>
            </div>
            {a.pinned && <Pin size={14} color={c.honey} strokeWidth={2.6} />}
          </div>
          <div style={{ fontFamily: display, fontWeight: 600, fontSize: 16, color: c.ink, lineHeight: 1.25, marginBottom: 5 }}>{a.title}</div>
          <div style={{ fontFamily: body, fontSize: 13.5, color: c.sub, lineHeight: 1.45 }}>{a.body}</div>
          {ackMode && (iAcked
            ? <div style={{ marginTop: 12, display: "flex", alignItems: "center", gap: 6, fontFamily: body, fontSize: 12.5, fontWeight: 700, color: "#3E7C57" }}><Check size={15} strokeWidth={3} />You acknowledged this</div>
            : <button onClick={() => setAcked((p) => new Set(p).add(i))} style={{ marginTop: 12, width: "100%", background: c.honey, border: "none", borderRadius: 11, padding: "10px 0", fontFamily: display, fontWeight: 700, fontSize: 13.5, color: c.pine, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}><Check size={15} strokeWidth={3} />Got it \u2014 acknowledge</button>
          )}
          {a.readBy && (
            <button onClick={() => onReceipts(a)} style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 12, paddingTop: 11, borderTop: "1px solid " + c.line, background: "none", border: "none", cursor: "pointer", width: "100%" }}>
              <Eye size={14} color={c.faint} />
              <span style={{ fontFamily: body, fontSize: 12, fontWeight: 600, color: c.sub }}>{ackMode ? "Acknowledged by " : "Seen by "}{a.readBy.length} of {total}</span>
              {a.notYet.length > 0 && <span style={{ fontFamily: body, fontSize: 11, fontWeight: 700, color: c.honey, background: c.honey + "1F", padding: "2px 7px", borderRadius: 999 }}>{a.notYet.length} {ackMode ? "not acked" : "not yet"}</span>}
              <ChevronDown size={14} color={c.faint} style={{ marginLeft: "auto", transform: "rotate(-90deg)" }} />
            </button>
          )}
        </div>
        );
      })}
    </div>
  );
}

function SectionLabel({ icon: Icon, text, note }) {

function GroupsScreen({ joined, toggle, open, requests, addRequest }) {
  const [asking, setAsking] = useState(false);
  const [q, setQ] = useState("");
  const submit = () => { if (!q.trim()) return; addRequest(q.trim()); setQ(""); setAsking(false); };
  return (
    <div style={{ padding: "4px 16px 20px" }}>
      <SectionLabel icon={Sparkles} text="Interest fields" note="Join what you're into" />
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        {INTERESTS.map((g) => {
          const Icon = g.icon; const on = joined.has(g.id);
          const hasSubs = !!g.subs;
          const joinedSubs = hasSubs ? g.subs.filter((s) => joined.has(g.id + ":" + s)).length : 0;
          return (<div key={g.id} onClick={() => open(g)} style={{ background: c.card, border: "1px solid " + c.line, borderRadius: 16, padding: 13, cursor: "pointer" }}>
            <div style={{ width: 38, height: 38, borderRadius: 11, background: g.color + "1A", display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 10 }}><Icon size={19} color={g.color} strokeWidth={2.2} /></div>

            <div style={{ fontFamily: body, fontSize: 11.5, color: c.faint, marginBottom: 10 }}>{hasSubs ? g.subs.length + " groups" + (joinedSubs ? " \u00b7 " + joinedSubs + " joined" : "") : (g.members + (on ? 1 : 0)) + " members"}</div>
            {hasSubs
              ? <button onClick={(e) => { e.stopPropagation(); open(g); }} style={{ width: "100%", border: "none", borderRadius: 9, padding: "7px 0", fontFamily: body, fontWeight: 700, fontSize: 12.5, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 4, background: g.color + "18", color: g.color }}>Choose<ChevronDown size={13} strokeWidth={3} style={{ transform: "rotate(-90deg)" }} /></button>
              : <button onClick={(e) => { e.stopPropagation(); toggle(g.id); }} style={{ width: "100%", border: "none", borderRadius: 9, padding: "7px 0", fontFamily: body, fontWeight: 700, fontSize: 12.5, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 5, background: on ? g.color + "18" : g.color, color: on ? g.color : "#fff" }}>{on ? <><Check size={13} strokeWidth={3} />Joined</> : <><Plus size={13} strokeWidth={3} />Join</>}</button>}
          </div>);
        })}
      </div>
      <div style={{ marginTop: 12, background: c.card, border: "1px dashed " + c.honey, borderRadius: 16, padding: 14 }}>
        {!asking ? (
          <button onClick={() => setAsking(true)} style={{ display: "flex", alignItems: "center", gap: 8, background: "none", border: "none", cursor: "pointer", width: "100%" }}>
            <div style={{ width: 34, height: 34, borderRadius: 10, background: c.honey + "22", display: "flex", alignItems: "center", justifyContent: "center" }}><Plus size={18} color={c.honey} strokeWidth={2.6} /></div>
            <div style={{ textAlign: "left" }}>
              <div style={{ fontFamily: body, fontWeight: 700, fontSize: 13.5, color: c.ink }}>Don't see your thing?</div>
              <div style={{ fontFamily: body, fontSize: 11.5, color: c.faint }}>Request a field - needlepoint, disc golf, anything</div>
            </div>
          </button>
        ) : (
          <div>
            <input autoFocus value={q} onChange={(e) => setQ(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="e.g. Needlepoint" style={{ width: "100%", border: "1px solid " + c.line, borderRadius: 10, padding: "9px 12px", fontFamily: body, fontSize: 13.5, outline: "none", color: c.ink, marginBottom: 8, boxSizing: "border-box" }} />
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={submit} style={{ flex: 1, background: c.honey, border: "none", borderRadius: 9, padding: "8px 0", fontFamily: body, fontWeight: 700, fontSize: 12.5, color: "#fff", cursor: "pointer" }}>Request field</button>
              <button onClick={() => setAsking(false)} style={{ background: "none", border: "1px solid " + c.line, borderRadius: 9, padding: "8px 14px", fontFamily: body, fontWeight: 700, fontSize: 12.5, color: c.sub, cursor: "pointer" }}>Cancel</button>
            </div>
          </div>
        )}
        {requests.map((r, i) => (<div key={i} style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 10, fontFamily: body, fontSize: 12, color: c.sub }}><Check size={13} color={c.secureHi} strokeWidth={3} /> "{r}" requested - pending admin review</div>))}
      </div>
      <div style={{ height: 22 }} />
      <SectionLabel icon={Building2} text="Departments" note="Your team channels" />
      {DEPARTMENTS.map((d) => (
        <div key={d.id} onClick={() => open({ ...d, dept: true, color: c.pine, icon: Hash })} style={{ display: "flex", alignItems: "center", gap: 12, background: c.card, border: "1px solid " + c.line, borderRadius: 14, padding: "11px 13px", marginBottom: 8, cursor: "pointer" }}>
          <div style={{ width: 34, height: 34, borderRadius: 10, background: c.pine + "12", display: "flex", alignItems: "center", justifyContent: "center" }}><Hash size={16} color={c.pine} strokeWidth={2.4} /></div>
          <div style={{ flex: 1 }}><div style={{ fontFamily: body, fontWeight: 700, fontSize: 14, color: c.ink }}>{d.name}</div><div style={{ fontFamily: body, fontSize: 11.5, color: c.faint }}>{d.members} members</div></div>
        </div>
      ))}
    </div>
  );
}

        </div>
        <div style={{ display: "flex", gap: 16, marginTop: 14, fontFamily: body, fontSize: 12, opacity: 0.85 }}>

              {isOpen && (

            </div>

              <span style={{ position: "absolute", top: 3, left: channels[row.k] ? 20 : 3, width: 17, height: 17, borderRadius: 999, background: "#fff", transition: "left 0.15s" }} />
            </button>
          </div>
        ))}
        <div style={{ display: "flex", alignItems: "center", gap: 5, marginTop: 6, paddingTop: 10, borderTop: "1px solid rgba(245,241,232,0.1)", fontFamily: body, fontSize: 10.5, color: "rgba(245,241,232,0.5)" }}><ShieldCheck size={11} color={c.secureHi} /> Every channel uses PHI-safe wording - never a patient name.</div>
      </div>
      <div style={{ fontFamily: body, fontSize: 10.5, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "rgba(245,241,232,0.4)", margin: "0 14px 8px" }}>Message trail</div>
      <div style={{ display: "flex", alignItems: "center", gap: 8, margin: "0 14px 10px", background: "rgba(245,241,232,0.06)", border: "1px solid rgba(245,241,232,0.14)", borderRadius: 10, padding: "8px 11px" }}>
        <Search size={14} color="rgba(245,241,232,0.4)" />
        <span style={{ fontFamily: body, fontSize: 12.5, color: "rgba(245,241,232,0.4)" }}>Filter by patient, sender, date, or action</span>
      </div>
      <div style={{ flex: 1, overflowY: "auto", padding: "0 14px 16px" }}>
        {AUDIT.map((m) => (
          <div key={m.id} style={{ background: "rgba(245,241,232,0.05)", border: "1px solid rgba(245,241,232,0.1)", borderRadius: 16, padding: 14, marginBottom: 12 }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 9 }}>
              <span style={{ fontFamily: body, fontSize: 11, fontWeight: 700, color: "rgba(245,241,232,0.55)", letterSpacing: "0.03em" }}>MSG #{m.id}</span>
              <span style={{ display: "inline-flex", alignItems: "center", gap: 4, fontFamily: body, fontSize: 10.5, fontWeight: 700, color: c.secureHi, background: "rgba(79,182,138,0.14)", padding: "2px 8px", borderRadius: 999 }}><Lock size={10} strokeWidth={2.6} />Sealed \u00b7 {m.hash}</span>
            </div>
            <div style={{ background: "rgba(245,241,232,0.06)", borderLeft: "2px solid rgba(245,241,232,0.25)", borderRadius: "0 8px 8px 0", padding: "8px 11px", fontFamily: body, fontSize: 12.5, color: "#F5F1E8", lineHeight: 1.4, marginBottom: 10 }}>{m.content}</div>
            <div style={{ fontFamily: body, fontSize: 11, color: "rgba(245,241,232,0.5)", marginBottom: 12 }}>To: {m.scope} \u00b7 {m.date}</div>
            <div>
              {m.events.map((e, i) => (
                <div key={i} style={{ display: "flex", alignItems: "center", gap: 9, marginBottom: i === m.events.length - 1 ? 0 : 8 }}>
                  <span style={{ width: 7, height: 7, borderRadius: 999, background: ACTION_COLOR[e.action], flexShrink: 0 }} />
                  <span style={{ fontFamily: body, fontSize: 10.5, color: "rgba(245,241,232,0.4)", width: 58, flexShrink: 0, fontVariantNumeric: "tabular-nums" }}>{e.t}</span>
                  <span style={{ fontFamily: body, fontSize: 12, fontWeight: 700, color: ACTION_COLOR[e.action] === "rgba(245,241,232,0.4)" ? "rgba(245,241,232,0.75)" : ACTION_COLOR[e.action] }}>{e.action}</span>
                  <span style={{ fontFamily: body, fontSize: 12, color: "rgba(245,241,232,0.6)" }}>\u00b7 {e.who}</span>
                </div>
              ))}
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 5, marginTop: 12, paddingTop: 10, borderTop: "1px solid rgba(245,241,232,0.1)", fontFamily: body, fontSize: 10.5, color: "rgba(245,241,232,0.45)" }}>
              <Clock size={11} /> Immutable \u00b7 retained until {m.retain}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function ProfileScreen({ joined, onAdmin }) {
  const mine = INTERESTS.filter((i) => joined.has(i.id) || (i.subs && i.subs.some((s) => joined.has(i.id + ":" + s))));
  const [myDepts, setMyDepts] = useState([{ name: "Marketing", status: "active" }, { name: "Physicians / Administration", status: "pending" }]);
  const [reqOpen, setReqOpen] = useState(false);
  const requestDept = (name) => { setMyDepts((p) => [...p, { name, status: "pending" }]); setReqOpen(false); };
  const available = DEPARTMENTS.filter((d) => !myDepts.some((m) => m.name === d.name));
  const [editing, setEditing] = useState(false);
  const [prof, setProf] = useState({ home: "Oxford, Mississippi", school: "University of Mississippi", ask: "Pickleball strategy, project cars, side hustles" });
  const [snap, setSnap] = useState(prof);
  const startEdit = () => { setSnap(prof); setEditing(true); };
  const cancelEdit = () => { setProf(snap); setEditing(false); };
  const PFIELDS = [
    { k: "home", icon: MapPin, label: "Home base" },
    { k: "school", icon: GraduationCap, label: "School" },
    { k: "ask", icon: Sparkles, label: "Ask me about" },
  ];
  const Field = ({ icon: Icon, label, value }) => (
    <div style={{ display: "flex", gap: 11, padding: "12px 0", borderBottom: "1px solid " + c.line }}>
      <Icon size={17} color={c.honey} strokeWidth={2.2} style={{ marginTop: 1 }} />
      <div><div style={{ fontFamily: body, fontSize: 11, fontWeight: 700, color: c.faint, textTransform: "uppercase", letterSpacing: "0.05em" }}>{label}</div><div style={{ fontFamily: body, fontSize: 14, color: c.ink, fontWeight: 500 }}>{value}</div></div>
    </div>
  );
  return (
    <div>
      <div style={{ background: c.pine, padding: "22px 16px 20px", color: "#F5F1E8" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
          <Avatar name="Worth Ainsworth" size={62} bg={c.honey} />
          <div><div style={{ fontFamily: display, fontWeight: 700, fontSize: 21 }}>Worth Ainsworth</div><div style={{ fontFamily: body, fontSize: 13, opacity: 0.85 }}>Physician Liaison \u00b7 Oxford</div></div>
        </div>
      </div>
      <div style={{ padding: "6px 16px 20px" }}>
        <div style={{ fontFamily: display, fontWeight: 700, fontSize: 14, color: c.ink, margin: "14px 0 6px" }}>My interests</div>
        <div style={{ fontFamily: body, fontSize: 12, color: c.faint, marginBottom: 8 }}>Tap a field to add your story - level, what you're after, who you want to meet.</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginBottom: 8 }}>{mine.length ? mine.map((g) => <Chip key={g.id} interest={g} active />) : <span style={{ fontFamily: body, fontSize: 12.5, color: c.faint }}>Join a field on the Groups tab and it shows up here.</span>}</div>
        {PFIELDS.map(({ k, icon: Icon, label }) => (
          <div key={k} style={{ display: "flex", gap: 11, padding: "12px 0", borderBottom: "1px solid " + c.line }}>
            <Icon size={17} color={c.honey} strokeWidth={2.2} style={{ marginTop: 1 }} />
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: body, fontSize: 11, fontWeight: 700, color: c.faint, textTransform: "uppercase", letterSpacing: "0.05em" }}>{label}</div>
              {editing
                ? <input value={prof[k]} onChange={(e) => setProf((p) => ({ ...p, [k]: e.target.value }))} style={{ width: "100%", border: "1px solid " + c.line, borderRadius: 8, padding: "6px 9px", fontFamily: body, fontSize: 14, color: c.ink, outline: "none", marginTop: 4, boxSizing: "border-box", background: c.paper }} />
                : <div style={{ fontFamily: body, fontSize: 14, color: c.ink, fontWeight: 500 }}>{prof[k]}</div>}
            </div>
          </div>
        ))}
        <div style={{ fontFamily: display, fontWeight: 700, fontSize: 14, color: c.ink, margin: "20px 0 8px" }}>My departments</div>
        {myDepts.map((d, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 0", borderBottom: "1px solid " + c.line }}>
            <Building2 size={16} color={c.honey} strokeWidth={2.2} />
            <span style={{ flex: 1, fontFamily: body, fontSize: 14, color: c.ink, fontWeight: 500 }}>{d.name}</span>
            {d.status === "active"
              ? <span style={{ fontFamily: body, fontSize: 10.5, fontWeight: 700, color: "#3E7C57", background: "rgba(62,124,87,0.14)", padding: "3px 9px", borderRadius: 999 }}>Active</span>
              : <span style={{ fontFamily: body, fontSize: 10.5, fontWeight: 700, color: "#B4772A", background: c.honey + "22", padding: "3px 9px", borderRadius: 999 }}>Awaiting manager</span>}
          </div>
        ))}
        {!reqOpen ? (
          <button onClick={() => setReqOpen(true)} disabled={available.length === 0} style={{ marginTop: 10, display: "flex", alignItems: "center", gap: 6, background: "none", border: "1px dashed " + c.honey, borderRadius: 10, padding: "9px 12px", width: "100%", justifyContent: "center", fontFamily: body, fontWeight: 700, fontSize: 12.5, color: c.honey, cursor: "pointer" }}><Plus size={13} strokeWidth={3} />Request another department</button>
        ) : (
          <div style={{ marginTop: 10 }}>
            <div style={{ fontFamily: body, fontSize: 11.5, color: c.faint, marginBottom: 8 }}>Pick one - it goes to that department's manager to approve.</div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
              {available.map((d) => (
                <button key={d.id} onClick={() => requestDept(d.name)} style={{ border: "1px solid " + c.line, background: c.card, cursor: "pointer", fontFamily: body, fontSize: 12, fontWeight: 600, padding: "6px 11px", borderRadius: 999, color: c.sub }}>{d.name}</button>
              ))}
            </div>
            <button onClick={() => setReqOpen(false)} style={{ marginTop: 8, background: "none", border: "none", fontFamily: body, fontSize: 12, fontWeight: 700, color: c.faint, cursor: "pointer" }}>Cancel</button>
          </div>
        )}
        <div style={{ display: "flex", alignItems: "center", gap: 5, marginTop: 10, fontFamily: body, fontSize: 11, color: c.faint }}><ShieldCheck size={11} color="#3E7C57" /> Managers add or remove members for their own department.</div>
        {editing ? (
          <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
            <button onClick={() => setEditing(false)} style={{ flex: 1, background: c.pine, border: "none", borderRadius: 12, padding: "11px 0", fontFamily: body, fontWeight: 700, fontSize: 13.5, color: "#F5F1E8", cursor: "pointer" }}>Save changes</button>
            <button onClick={cancelEdit} style={{ background: c.card, border: "1px solid " + c.line, borderRadius: 12, padding: "11px 18px", fontFamily: body, fontWeight: 700, fontSize: 13.5, color: c.sub, cursor: "pointer" }}>Cancel</button>
          </div>
        ) : (
          <button onClick={startEdit} style={{ marginTop: 16, width: "100%", background: c.card, border: "1px solid " + c.line, borderRadius: 12, padding: "11px 0", fontFamily: body, fontWeight: 700, fontSize: 13.5, color: c.pine, cursor: "pointer" }}>Edit profile</button>
        )}
        <button onClick={onAdmin} style={{ marginTop: 10, width: "100%", background: c.secure, border: "none", borderRadius: 12, padding: "11px 0", fontFamily: body, fontWeight: 700, fontSize: 13.5, color: "#F5F1E8", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 7 }}><ShieldCheck size={15} color={c.secureHi} /> Admin console</button>
        <div style={{ textAlign: "center", marginTop: 20, fontFamily: body, fontSize: 10.5, fontWeight: 700, letterSpacing: "0.12em", textTransform: "uppercase", color: c.faint }}>Powered by CommonGround</div>
      </div>
    </div>
  );
}

function ReceiptsScreen({ item, back }) {
  const [reminded, setReminded] = useState(false);
  const total = item.readBy.length + item.notYet.length;
  const ack = !!item.requireAck;
  const Row = ({ name, seen }) => {
    const p = personByName(name);
    return (
      <div style={{ display: "flex", alignItems: "center", gap: 11, padding: "9px 0", borderBottom: "1px solid " + c.line }}>
        <Avatar name={name} size={34} bg={seen ? c.pine2 : c.faint} />
        <div style={{ flex: 1 }}>
          <div style={{ fontFamily: body, fontWeight: 700, fontSize: 13.5, color: c.ink }}>{name}</div>
          <div style={{ fontFamily: body, fontSize: 11.5, color: c.faint }}>{p ? p.role + " \u00b7 " + p.loc : "Staff"}</div>
        </div>
        {seen
          ? <span style={{ display: "inline-flex", alignItems: "center", gap: 4, fontFamily: body, fontSize: 11, fontWeight: 700, color: "#3E7C57" }}><Check size={13} strokeWidth={3} />{ack ? "Acknowledged" : "Read"}</span>
          : <span style={{ fontFamily: body, fontSize: 11, fontWeight: 700, color: c.honey }}>Not yet</span>}
      </div>
    );
  };
  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%", background: c.paper }}>
      <div style={{ background: c.pine, padding: "14px 16px 18px", color: "#F5F1E8" }}>
        <button onClick={back} style={{ background: "none", border: "none", color: "rgba(245,241,232,0.75)", display: "flex", alignItems: "center", gap: 3, fontFamily: body, fontSize: 13, fontWeight: 600, cursor: "pointer", marginBottom: 12 }}><ChevronLeft size={16} /> Back</button>
        <div style={{ fontFamily: body, fontSize: 11.5, opacity: 0.7, marginBottom: 3 }}>{ack ? "Acknowledgments" : "Read receipts"} \u00b7 {item.audience}</div>
        <div style={{ fontFamily: display, fontWeight: 700, fontSize: 18, lineHeight: 1.2 }}>{item.title}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 12 }}>
          <div style={{ flex: 1, height: 7, background: "rgba(245,241,232,0.18)", borderRadius: 999, overflow: "hidden" }}>
            <div style={{ width: Math.round((item.readBy.length / total) * 100) + "%", height: "100%", background: c.secureHi }} />
          </div>
          <span style={{ fontFamily: body, fontSize: 12, fontWeight: 700 }}>{item.readBy.length}/{total} {ack ? "acked" : "read"}</span>
        </div>
      </div>
      <div style={{ flex: 1, overflowY: "auto", padding: "14px 16px 20px" }}>
        {item.notYet.length > 0 && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
            <div style={{ fontFamily: display, fontWeight: 700, fontSize: 13.5, color: c.ink }}>{ack ? "Not yet acknowledged" : "Not yet seen"} ({item.notYet.length})</div>
            <button onClick={() => setReminded(true)} disabled={reminded} style={{ display: "flex", alignItems: "center", gap: 5, background: reminded ? "none" : c.honey, border: "none", borderRadius: 999, padding: reminded ? 0 : "5px 11px", fontFamily: body, fontWeight: 700, fontSize: 11.5, color: reminded ? c.sub : "#fff", cursor: reminded ? "default" : "pointer" }}>{reminded ? <><Check size={12} strokeWidth={3} />Reminder sent</> : <><Bell size={12} />Remind them</>}</button>
          </div>
        )}
        {item.notYet.map((n) => <Row key={n} name={n} seen={false} />)}
        <div style={{ fontFamily: display, fontWeight: 700, fontSize: 13.5, color: c.ink, margin: "18px 0 8px" }}>{ack ? "Acknowledged" : "Read"} ({item.readBy.length})</div>
        {item.readBy.map((n) => <Row key={n} name={n} seen={true} />)}
      </div>
    </div>
  );
}

const TABS = [
  { id: "home", label: "Home", icon: Home }, { id: "groups", label: "Groups", icon: Users },
  { id: "messages", label: "Chats", icon: MessageCircle }, { id: "people", label: "People", icon: Search },
  { id: "me", label: "Me", icon: User },
];

function App() {
  const [onboarded, setOnboarded] = useState(false);
  const [tab, setTab] = useState("home");
  const [joined, setJoined] = useState(new Set(["cars", "pickle", "sports"]));
  const [openGroup, setOpenGroup] = useState(null);
  const [openPerson, setOpenPerson] = useState(null);
  const [openThread, setOpenThread] = useState(null);
  const [secure, setSecure] = useState(false);
  const [openAdmin, setOpenAdmin] = useState(false);
  const [openReceipts, setOpenReceipts] = useState(null);
  const [secureMsgs, setSecureMsgs] = useState(SECURE_SEED);
  const secureOpen = secureMsgs.filter((m) => m.me).length;
  const chatUnread = THREADS.reduce((a, t) => a + t.unread, 0) + secureOpen;
  const [posts, setPosts] = useState(SEED_POSTS);
  const [requests, setRequests] = useState([]);
  const toggle = (id) => setJoined((p) => { const n = new Set(p); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const addPost = (p) => setPosts((prev) => [p, ...prev]);
  const addRequest = (r) => setRequests((prev) => [...prev, r]);
  const messagePerson = (person, interestName) => setOpenThread({ name: person.name, seedInterest: interestName });
  const titles = { home: "The Break Room", groups: "Groups", messages: "Messages", people: "Directory", me: "Profile" };
  const subtitle = { home: "Specialty Orthopedic Group", groups: "Find your people", messages: "", people: "200 teammates, 5 locations", me: "" };
  const hideHeader = openGroup || openPerson;
  const fullOverlay = openReceipts ? <ReceiptsScreen item={openReceipts} back={() => setOpenReceipts(null)} /> : openAdmin ? <AuditLog back={() => setOpenAdmin(false)} /> : secure ? <SecureScreen back={() => setSecure(false)} msgs={secureMsgs} setMsgs={setSecureMsgs} /> : openThread ? <ThreadDetail thread={openThread} seedInterest={openThread.seedInterest} back={() => setOpenThread(null)} /> : null;
  return (
    <div style={{ minHeight: "100vh", background: c.paper, display: "flex", alignItems: "center", justifyContent: "center", padding: 20, fontFamily: body }}>
      <style>{"@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400..700&display=swap'); *::-webkit-scrollbar{width:0;height:0}"}</style>
      <div style={{ width: 400, maxWidth: "100%", height: 780, background: c.paper, borderRadius: 34, overflow: "hidden", boxShadow: "0 24px 60px rgba(28,27,22,0.28)", border: "1px solid rgba(0,0,0,0.06)", display: "flex", flexDirection: "column", position: "relative" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 20px 2px", fontFamily: body, fontSize: 12.5, fontWeight: 700, color: (secure || openAdmin || !onboarded) ? "#F5F1E8" : c.ink, background: (secure || openAdmin || !onboarded) ? c.pine : "transparent" }}>
          <span>9:41</span><span style={{ display: "flex", gap: 4, alignItems: "center", opacity: 0.7 }}><span>••••</span><Bell size={12} /></span>
        </div>
        {!onboarded ? (
          <div style={{ flex: 1, overflow: "hidden" }}><Onboarding done={(dest) => { setOnboarded(true); if (typeof dest === "string") setTab(dest); }} /></div>
        ) : fullOverlay ? (<div style={{ flex: 1, overflow: "hidden" }}>{fullOverlay}</div>) : (
          <>
            {!hideHeader && (<div style={{ padding: "8px 16px 12px" }}><div style={{ fontFamily: display, fontWeight: 800, fontSize: 25, color: c.ink, letterSpacing: "-0.02em", lineHeight: 1 }}>{titles[tab]}</div>{subtitle[tab] && <div style={{ fontFamily: body, fontSize: 12.5, color: c.faint, marginTop: 3 }}>{subtitle[tab]}</div>}</div>)}
            <div style={{ flex: 1, overflowY: "auto" }}>
              {openGroup ? <GroupDetail group={openGroup} joined={joined} toggle={toggle} back={() => setOpenGroup(null)} openPerson={(p) => { setOpenGroup(null); setOpenPerson(p); }} />
                : openPerson ? <PersonDetail person={openPerson} myTags={joined} back={() => setOpenPerson(null)} onMessage={(p, name) => messagePerson(p, name)} />
                : (
                  <>
                    {tab === "home" && <HomeScreen posts={posts} addPost={addPost} onReceipts={setOpenReceipts} />}
                    {tab === "groups" && <GroupsScreen joined={joined} toggle={toggle} open={setOpenGroup} requests={requests} addRequest={addRequest} />}
                    {tab === "messages" && <MessagesScreen open={setOpenThread} openSecure={() => setSecure(true)} secureOpen={secureOpen} />}
                    {tab === "people" && <DirectoryScreen myTags={joined} openPerson={setOpenPerson} />}
                    {tab === "me" && <ProfileScreen joined={joined} onAdmin={() => setOpenAdmin(true)} />}
                  </>
                )}
            </div>
            <div style={{ display: "flex", borderTop: "1px solid " + c.line, background: c.card, paddingBottom: 6 }}>
              {TABS.map((t) => {
                const active = tab === t.id && !openGroup && !openPerson; const Icon = t.icon;
                return (<button key={t.id} onClick={() => { setTab(t.id); setOpenGroup(null); setOpenPerson(null); }} style={{ flex: 1, background: "none", border: "none", cursor: "pointer", padding: "9px 0 4px", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, color: active ? c.pine : c.faint }}><div style={{ position: "relative" }}><Icon size={21} strokeWidth={active ? 2.5 : 2} />{t.id === "messages" && chatUnread > 0 && <span style={{ position: "absolute", top: -4, right: -9, background: c.honey, color: "#fff", fontFamily: body, fontWeight: 700, fontSize: 9, minWidth: 15, height: 15, borderRadius: 999, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 4px" }}>{chatUnread}</span>}</div><span style={{ fontFamily: body, fontSize: 10.5, fontWeight: active ? 700 : 500 }}>{t.label}</span></button>);
              })}
            </div>
          </>
        )}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Break Room — Sandbox Test</title>
<style>
  :root { --paper:#EFEBE2; --pine:#1E3A32; --pine2:#2E5247; --honey:#E19A38; --ink:#1C1B16; --line:#E8E3D8; --faint:#A6A297; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--paper); font-family: system-ui, -apple-system, sans-serif; color: var(--ink); display: flex; justify-content: center; padding: 24px 16px 48px; }
  .card { width: 100%; max-width: 460px; }
  h1 { font-size: 22px; margin: 0 0 2px; color: var(--pine); }
  .sub { color: var(--faint); font-size: 13px; margin-bottom: 20px; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  input { flex: 1; border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; font-size: 15px; outline: none; background: #fff; }
  button { border: none; border-radius: 11px; padding: 12px 18px; font-size: 15px; font-weight: 700; cursor: pointer; background: var(--honey); color: var(--pine); }
  button:disabled { opacity: 0.5; cursor: default; }
  .status { min-height: 18px; font-size: 12px; color: var(--faint); margin-bottom: 18px; }
  .status.err { color: #B4532F; }
  .listhead { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--faint); margin-bottom: 10px; }
  .member { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 11px 13px; margin-bottom: 8px; }
  .avatar { width: 36px; height: 36px; border-radius: 999px; background: var(--pine2); color: #F5F1E8; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
  .mname { font-weight: 600; font-size: 15px; }
  .empty { color: var(--faint); font-size: 14px; padding: 8px 0; }
  .foot { margin-top: 20px; font-size: 11px; color: var(--faint); text-align: center; line-height: 1.5; }
</style>
</head>
<body>
<div class="card">
  <h1>The Break Room · Sandbox Test</h1>
  <div class="sub">Type your name. It saves to the shared database — anyone who opens this page sees everyone who joined.</div>

  <div class="row">
    <input id="nameInput" placeholder="Your name" autocomplete="off" />
    <button id="joinBtn">Join</button>
  </div>
  <div class="status" id="status"></div>

  <div class="listhead" id="listhead">Who's here</div>
  <div id="list"><div class="empty">Loading…</div></div>

  <div class="foot">Live shared data via Supabase · a real backend, working.<br/>Refreshes automatically every few seconds.</div>
</div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const supabase = createClient(
    "https://pgvrfrfmknmpsfufzjzh.supabase.co",
    "sb_publishable_hqlwbvYBa9OkiwY6ywX5Wg_9y2QnlLc"
  );

  const $ = (id) => document.getElementById(id);
  const statusEl = $("status");
  const listEl = $("list");
  const headEl = $("listhead");
  const input = $("nameInput");
  const btn = $("joinBtn");

  function setStatus(msg, isErr) {
    statusEl.textContent = msg || "";
    statusEl.className = "status" + (isErr ? " err" : "");
  }

  function initials(name) {
    return name.trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  }

  async function loadProfiles() {
    const { data, error } = await supabase
      .from("profiles")
      .select("name, created_at")
      .order("created_at", { ascending: true });
    if (error) { setStatus("Read error: " + error.message, true); return; }
    headEl.textContent = "Who's here (" + data.length + ")";
    if (!data.length) { listEl.innerHTML = '<div class="empty">Nobody yet — be the first to join.</div>'; return; }
    listEl.innerHTML = data.map((p) =>
      '<div class="member"><div class="avatar">' + initials(p.name) + '</div><div class="mname">' + p.name.replace(/</g, "&lt;") + '</div></div>'
    ).join("");
  }

  async function join() {
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    btn.disabled = true;
    setStatus("Saving…");
    const { error } = await supabase.from("profiles").insert({ name });
    btn.disabled = false;
    if (error) { setStatus("Save error: " + error.message, true); return; }
    input.value = "";
    setStatus("Saved! 🎉");
    loadProfiles();
  }

  btn.addEventListener("click", join);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") join(); });

  loadProfiles();
  setInterval(loadProfiles, 4000); // keep the list fresh so two people see each other
</script>
</body>
</html>

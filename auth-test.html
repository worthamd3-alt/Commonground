<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Break Room — accounts test</title>
<style>
  :root { --pine:#1E3A32; --paper:#F5F1E8; --card:#FFFFFF; --line:#E3DCCE; --ink:#1C1B16; --sub:#5C574B; --faint:#8C8577; --honey:#E09A38; --bad:#B4402F; --good:#3E7C57; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; }
  .wrap { max-width:480px; margin:0 auto; padding:0 0 40px; }
  header { background:var(--pine); color:var(--paper); padding:18px 18px 20px; }
  header h1 { margin:0; font-size:20px; font-weight:800; letter-spacing:-0.01em; }
  header p { margin:5px 0 0; font-size:12.5px; opacity:.8; line-height:1.45; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:15px; margin:14px 16px; }
  .box h2 { margin:0 0 3px; font-size:14.5px; font-weight:700; }
  .box .note { margin:0 0 12px; font-size:11.5px; color:var(--faint); line-height:1.45; }
  label { display:block; font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--faint); margin:0 0 5px; }
  input { width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 12px; font-size:16px; font-family:inherit; color:var(--ink); background:var(--paper); outline:none; margin-bottom:9px; }
  input:focus { border-color:var(--honey); }
  textarea { width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 12px; font-size:16px; font-family:inherit; color:var(--ink); background:var(--paper); outline:none; resize:none; }
  button { border:none; border-radius:10px; padding:11px 16px; font-size:13.5px; font-weight:700; font-family:inherit; cursor:pointer; }
  .primary { background:var(--honey); color:var(--pine); width:100%; }
  .ghost { background:none; border:1px solid var(--line); color:var(--sub); }
  .row { display:flex; gap:8px; }
  .row button { flex:1; }
  .msg { font-size:12.5px; line-height:1.45; padding:10px 12px; border-radius:10px; margin-top:10px; display:none; }
  .msg.show { display:block; }
  .msg.err { background:#FBEAE7; color:var(--bad); }
  .msg.ok  { background:#E8F1EB; color:var(--good); }
  .who { display:flex; align-items:center; gap:10px; }
  .dot { width:36px; height:36px; border-radius:99px; background:var(--pine); color:var(--paper); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0; }
  .who .n { font-weight:700; font-size:14px; }
  .who .e { font-size:11.5px; color:var(--faint); }
  .post { border-bottom:1px solid var(--line); padding:12px 0; }
  .post:last-child { border-bottom:none; padding-bottom:0; }
  .post .meta { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .post .nm { font-weight:700; font-size:13px; }
  .post .tm { font-size:11px; color:var(--faint); }
  .post .bd { font-size:13.5px; line-height:1.5; color:var(--ink); white-space:pre-wrap; word-break:break-word; }
  .post .del { background:none; border:none; padding:0; font-size:11px; font-weight:700; color:var(--faint); text-decoration:underline; cursor:pointer; margin-top:6px; }
  .empty { font-size:12.5px; color:var(--faint); text-align:center; padding:14px 0; }
  .live { display:flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--faint); }
  .pulse { width:7px; height:7px; border-radius:99px; background:var(--good); }
  .setup { background:#FBEAE7; color:var(--bad); font-size:12.5px; line-height:1.5; padding:14px 16px; margin:14px 16px; border-radius:12px; }
  code { background:rgba(0,0,0,.06); padding:1px 5px; border-radius:4px; font-size:11.5px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Break Room — accounts test</h1>
    <p>Step 2. Sign in, post to a shared feed, and see it survive a refresh — with each post owned by a real account.</p>
  </header>
  <div id="app"></div>
</div>

<script type="module">
// ============================================================
// PASTE YOUR PUBLISHABLE KEY BELOW (starts with sb_publishable_)
// It's in Supabase → Project Settings → API Keys.
// Same one that's already in your sandbox-test.html.
// Never paste the SECRET key (sb_secret_...) into a web page.
// ============================================================
const SUPABASE_URL = "https://pgvrfrfmknmpsfufzjzh.supabase.co";
const SUPABASE_KEY = "sb_publishable_hqlwbvYBa9OkiwY6ywX5Wg_9y2QnlLc";
// ============================================================

import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const app = document.getElementById("app");
const esc = (s) => String(s).replace(/[&<>"']/g, (m) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
const initials = (n) => (n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const ago = (iso) => {
  const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s/60) + "m ago";
  if (s < 86400) return Math.floor(s/3600) + "h ago";
  return Math.floor(s/86400) + "d ago";
};

if (SUPABASE_KEY.startsWith("PASTE")) {
  app.innerHTML = `<div class="setup"><strong>One thing first.</strong><br>Open this file in a text editor and paste your publishable key where it says <code>PASTE_YOUR_PUBLISHABLE_KEY_HERE</code>, then save and reload.</div>`;
  throw new Error("key not set");
}

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
let me = null, profile = null, timer = null;

const signedOut = () => `
  <div class="box">
    <h2>Sign in</h2>
    <p class="note">Use any email — it doesn't have to be real for this test, as long as you remember it. First time through, hit Create account.</p>
    <label>Your name</label>
    <input id="nm" placeholder="Worth Ainsworth" autocomplete="name" />
    <label>Email</label>
    <input id="em" type="email" placeholder="you@example.com" autocomplete="email" />
    <label>Password</label>
    <input id="pw" type="password" placeholder="at least 6 characters" autocomplete="current-password" />
    <div class="row">
      <button class="primary" id="up">Create account</button>
      <button class="ghost" id="in">Sign in</button>
    </div>
    <div class="msg" id="m"></div>
  </div>
  <div class="box">
    <h2>What this proves</h2>
    <p class="note" style="margin:0">That a real person can hold an account, that their posts belong to them, and that the database itself refuses to let anyone post as someone else — enforced by Postgres, not by this page.</p>
  </div>`;

const signedIn = () => `
  <div class="box">
    <div class="who">
      <div class="dot">${esc(initials(profile?.display_name))}</div>
      <div style="flex:1;min-width:0">
        <div class="n">${esc(profile?.display_name || "…")}</div>
        <div class="e">${esc(me.email)}</div>
      </div>
      <button class="ghost" id="out" style="padding:7px 12px;font-size:12px">Sign out</button>
    </div>
  </div>
  <div class="box">
    <h2>Post to the feed</h2>
    <p class="note">Everyone signed in sees this. Open it on your phone too.</p>
    <textarea id="bd" rows="3" placeholder="Say something…"></textarea>
    <div style="height:9px"></div>
    <button class="primary" id="send">Post</button>
    <div class="msg" id="m2"></div>
  </div>
  <div class="box">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <h2 style="margin:0">The feed</h2>
      <div class="live"><span class="pulse"></span>Live</div>
    </div>
    <div id="feed"><div class="empty">Loading…</div></div>
  </div>`;

function flash(id, text, ok) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.className = "msg show " + (ok ? "ok" : "err");
  if (ok) setTimeout(() => { el.className = "msg"; }, 3000);
}

async function loadFeed() {
  const box = document.getElementById("feed");
  if (!box) return;
  const { data, error } = await sb
    .from("feed_posts")
    .select("id, body, created_at, author_id, profiles(display_name)")
    .order("created_at", { ascending: false })
    .limit(50);
  if (error) { box.innerHTML = `<div class="empty">Couldn't load: ${esc(error.message)}</div>`; return; }
  if (!data.length) { box.innerHTML = `<div class="empty">Nothing yet. Post the first one.</div>`; return; }
  box.innerHTML = data.map((p) => `
    <div class="post">
      <div class="meta">
        <div class="dot" style="width:26px;height:26px;font-size:10px">${esc(initials(p.profiles?.display_name))}</div>
        <div class="nm">${esc(p.profiles?.display_name || "Someone")}</div>
        <div class="tm">${esc(ago(p.created_at))}</div>
      </div>
      <div class="bd">${esc(p.body)}</div>
      ${p.author_id === me.id ? `<button class="del" data-id="${p.id}">Delete</button>` : ""}
    </div>`).join("");
  box.querySelectorAll(".del").forEach((b) => b.onclick = async () => {
    await sb.from("feed_posts").delete().eq("id", b.dataset.id);
    loadFeed();
  });
}

async function render() {
  clearInterval(timer);
  const { data: { user } } = await sb.auth.getUser();
  me = user;
  if (!me) { app.innerHTML = signedOut(); wireOut(); return; }
  const { data: prof } = await sb.from("profiles").select("*").eq("id", me.id).single();
  profile = prof;
  app.innerHTML = signedIn();
  wireIn();
  loadFeed();
  timer = setInterval(loadFeed, 4000);
}

function wireOut() {
  const get = () => ({
    nm: document.getElementById("nm").value.trim(),
    em: document.getElementById("em").value.trim(),
    pw: document.getElementById("pw").value,
  });
  document.getElementById("up").onclick = async () => {
    const { nm, em, pw } = get();
    if (!nm) return flash("m", "Add your name first — it's what shows on your posts.");
    if (!em || !pw) return flash("m", "Email and password, please.");
    const { error } = await sb.auth.signUp({ email: em, password: pw, options: { data: { display_name: nm } } });
    if (error) return flash("m", error.message);
    flash("m", "Account created.", true);
    setTimeout(render, 600);
  };
  document.getElementById("in").onclick = async () => {
    const { em, pw } = get();
    if (!em || !pw) return flash("m", "Email and password, please.");
    const { error } = await sb.auth.signInWithPassword({ email: em, password: pw });
    if (error) return flash("m", error.message);
    render();
  };
}

function wireIn() {
  document.getElementById("out").onclick = async () => { await sb.auth.signOut(); render(); };
  document.getElementById("send").onclick = async () => {
    const ta = document.getElementById("bd");
    const body = ta.value.trim();
    if (!body) return;
    const { error } = await sb.from("feed_posts").insert({ author_id: me.id, body });
    if (error) return flash("m2", error.message);
    ta.value = "";
    loadFeed();
  };
}

render();
</script>
</body>
</html>
